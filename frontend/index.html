<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>איטליה</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffdb99, #c72c41);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    h1 { font-size: 3rem; text-shadow: 2px 2px 4px #000; }
    input, button { padding: 10px; font-size: 1rem; border-radius: 5px; }
    button { background-color: #008000; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #005900; }
    #message { background-color: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; max-width: 500px; }
  </style>
</head>
<body>

  <h1>!ברוכים הבאים לאיטליה</h1>

  <input type="text" id="newMessage" placeholder="כתוב הודעה כאן" />
  <button id="sendMessageBtn">שלח הודעה</button>
  <button id="getMessageBtn">קבל הודעה אחרונה</button>

  <p id="message"></p>

  <script>
    const apiUrl = 'http://localhost:3000/api/message';

    // שליחת הודעה
    document.getElementById('sendMessageBtn').onclick = () => {
      const content = document.getElementById('newMessage').value;
      fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        return res.json();
      })
      .then(data => alert(data.message))
      .catch(err => {
        console.error(err);
        alert('שגיאה בשליחת ההודעה');
      });
    }

    // קבלת ההודעה האחרונה
    document.getElementById('getMessageBtn').onclick = () => {
      fetch(apiUrl)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.json();
        })
        .then(data => {
          document.getElementById('message').innerText = data.message;
        })
        .catch(err => {
          console.error(err);
          document.getElementById('message').innerText = 'שגיאה בטעינת ההודעה';
        });
    }
  </script>
</body>
</html>
